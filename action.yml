name: 'Credactor - Secrets Redactor'
description: 'Read-only credential scan and CI gate. SARIF output, plus Gitleaks / TruffleHog / Betterleaks report ingestion. Never rewrites your checkout.'
author: 'Rx'

branding:
  icon: 'shield'
  color: 'purple'

inputs:
  path:
    description: >-
      Target to scan, relative to working-directory. Default ".".
      Must be a DIRECTORY when any from-* ingestion input is set.
    required: false
    default: '.'
  working-directory:
    description: >-
      Directory to run from. Both the target and the from-* report paths
      resolve against this, so run the external scanner from the same place.
    required: false
    default: '.'
  version:
    description: 'Credactor version to install from PyPI, or "latest".'
    required: false
    default: '2.7.4'
  python-version:
    description: 'Python version used to run Credactor. Requires 3.11 or newer.'
    required: false
    default: '3.11'
  format:
    description: 'Output format: text, json or sarif.'
    required: false
    default: 'text'
  output-file:
    description: >-
      Where to write a json/sarif report. Defaults to credactor-results.<ext>.
      Written after the scan. The destination must not be a symlink, must be a
      regular file or absent, and must resolve inside the workspace or the
      runner temp directory, or the step fails. Ignored for text format, which
      goes to the job log.
    required: false
    default: ''
  fail-on-findings:
    description: >-
      Fail the step when credentials are found (Credactor exit 1).
      Set false to report without gating, e.g. when Code Scanning is the gate.
      Errors (exit 2) always fail regardless of this input.
    required: false
    default: 'true'
  fail-on-error:
    description: >-
      Pass --fail-on-error, so unreadable files or undescendable directories
      exit 2 instead of warning. Do not combine with format sarif: exit 2
      writes an empty report that the upload step cannot parse.
    required: false
    default: 'false'
  scan-json:
    description: 'Pass --scan-json to also scan .json files (off by default upstream).'
    required: false
    default: 'false'
  scan-history:
    description: >-
      Pass --scan-history to scan up to the 100 most recent file-changing
      commits. Requires actions/checkout with fetch-depth 0, and cannot be
      combined with any from-* ingestion input.
    required: false
    default: 'false'
  config:
    description: >-
      Explicit .credactor.toml path (--config). Under --ci a config outside
      the project root is refused and the run is fatal.
    required: false
    default: ''
  verbose:
    description: 'Pass --verbose to log scan and suppression activity on stderr.'
    required: false
    default: 'false'
  from-gitleaks:
    description: >-
      Path to a Gitleaks JSON report to ingest, resolved against
      working-directory. Generate it without the Gitleaks --redact flag.
    required: false
    default: ''
  from-trufflehog:
    description: >-
      Path to a TruffleHog NDJSON report to ingest, resolved against
      working-directory. Pin TruffleHog to the filesystem or git source and
      pass --no-update in pipelines.
    required: false
    default: ''
  from-betterleaks:
    description: >-
      Path to a Betterleaks JSON report to ingest, resolved against
      working-directory. Use the dir or git subcommand, and generate the
      report without the Betterleaks --redact flag.
    required: false
    default: ''
  upload-sarif:
    description: >-
      Upload the SARIF report to GitHub Code Scanning. Requires format sarif
      and a job with security-events: write.
    required: false
    default: 'false'
  extra-args:
    description: >-
      Additional raw flags appended to the command, split on whitespace.
      Escape hatch for flags this action does not model.
    required: false
    default: ''

outputs:
  exit-code:
    description: 'Credactor exit code: 0 clean, 1 findings, 2 error.'
    value: ${{ steps.scan.outputs.exit-code }}
  findings-count:
    description: 'Number of findings, when format is json or sarif. Empty otherwise.'
    value: ${{ steps.scan.outputs.findings-count }}
  report-file:
    description: 'Physical path to the json/sarif report, as a native path, when one was written.'
    value: ${{ steps.scan.outputs.report-file }}

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install Credactor
      shell: bash
      # Run from the runner's temp directory in isolated mode (-I), so only
      # the installed pip and the standard library can be imported (SR-02).
      working-directory: ${{ runner.temp }}
      env:
        CREDACTOR_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        PYBIN="$(command -v python || command -v python3)"
        if [ "$CREDACTOR_VERSION" = "latest" ]; then
          "$PYBIN" -I -m pip install --disable-pip-version-check --quiet credactor
        else
          "$PYBIN" -I -m pip install --disable-pip-version-check --quiet "credactor==${CREDACTOR_VERSION}"
        fi
        # A console script puts its own bin/ directory first on sys.path, not
        # the current directory, so calling "credactor" directly is safe. Do
        # not replace it with "python -m credactor", which is not.
        credactor --version

    - name: Run Credactor
      id: scan
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        TARGET: ${{ inputs.path }}
        FORMAT: ${{ inputs.format }}
        OUTPUT_FILE: ${{ inputs.output-file }}
        FAIL_ON_ERROR: ${{ inputs.fail-on-error }}
        SCAN_JSON: ${{ inputs.scan-json }}
        SCAN_HISTORY: ${{ inputs.scan-history }}
        CONFIG_PATH: ${{ inputs.config }}
        VERBOSE: ${{ inputs.verbose }}
        FROM_GITLEAKS: ${{ inputs.from-gitleaks }}
        FROM_TRUFFLEHOG: ${{ inputs.from-trufflehog }}
        FROM_BETTERLEAKS: ${{ inputs.from-betterleaks }}
        EXTRA_ARGS: ${{ inputs.extra-args }}
      run: |
        set -uo pipefail

        # Values that reach messages, $GITHUB_OUTPUT or the argument list must
        # be single lines (SR-04). The working directory is checked both as
        # given and as resolved on disk. extra-args is split on whitespace, so
        # its line breaks (for example from a YAML block) become spaces.
        reject_line_breaks() {
          case "$2" in
            *$'\n'* | *$'\r'*)
              echo "::error::The $1 input contains a line break, which is not allowed."
              exit 2
              ;;
          esac
        }
        reject_line_breaks format "$FORMAT"
        reject_line_breaks working-directory "$PWD"
        reject_line_breaks working-directory "$(pwd -P)"
        reject_line_breaks path "$TARGET"
        reject_line_breaks output-file "$OUTPUT_FILE"
        reject_line_breaks config "$CONFIG_PATH"
        reject_line_breaks from-gitleaks "$FROM_GITLEAKS"
        reject_line_breaks from-trufflehog "$FROM_TRUFFLEHOG"
        reject_line_breaks from-betterleaks "$FROM_BETTERLEAKS"
        EXTRA_ARGS="${EXTRA_ARGS//[$'\r\n']/ }"

        case "$FORMAT" in
          text|json|sarif) ;;
          *)
            echo "::error::format must be text, json or sarif (got '$FORMAT')"
            exit 2
            ;;
        esac

        # --- Preflight: mirror Credactor's documented exit-2 contracts, but
        # --- fail with a message that names the workflow input at fault.
        INGEST=""
        for report in "$FROM_GITLEAKS" "$FROM_TRUFFLEHOG" "$FROM_BETTERLEAKS"; do
          if [ -n "$report" ]; then
            INGEST="yes"
            if [ ! -f "$report" ]; then
              echo "::error::Ingestion report not found: '$report' (resolved against '$PWD'). Did the scanner step run, and did it write the report to this path?"
              exit 2
            fi
          fi
        done

        if [ -n "$INGEST" ] && [ "$SCAN_HISTORY" = "true" ]; then
          echo "::error::scan-history cannot be combined with any from-* ingestion input. External reports reference on-disk files; history scanning references committed content."
          exit 2
        fi

        if [ -n "$INGEST" ] && [ ! -d "$TARGET" ]; then
          echo "::error::Ingestion requires a directory target so report file paths resolve. 'path' is '$TARGET'."
          exit 2
        fi

        if [ -n "$INGEST" ]; then
          echo "::notice::Run the external scanner and Credactor against the same root. A report generated at the repository root but ingested against a subdirectory makes its findings miss, and the run can still exit 0."
        fi

        if [ "$FAIL_ON_ERROR" = "true" ] && [ "$FORMAT" = "sarif" ]; then
          echo "::warning::fail-on-error with sarif output: an unreadable file exits 2 and writes an empty report, which the SARIF upload cannot parse. Gate on fail-on-error in a separate step."
        fi

        # --- Build the command. --ci is always passed: it forces read-only
        # --- (dry-run) and blocks --fix-all, so this action can never rewrite
        # --- the checkout.
        args=( --ci --format "$FORMAT" )

        if [ "$SCAN_JSON" = "true" ]; then args+=( --scan-json ); fi
        if [ "$SCAN_HISTORY" = "true" ]; then args+=( --scan-history ); fi
        if [ "$FAIL_ON_ERROR" = "true" ]; then args+=( --fail-on-error ); fi
        if [ "$VERBOSE" = "true" ]; then args+=( --verbose ); fi
        if [ -n "$CONFIG_PATH" ]; then args+=( --config "$CONFIG_PATH" ); fi
        if [ -n "$FROM_GITLEAKS" ]; then args+=( --from-gitleaks "$FROM_GITLEAKS" ); fi
        if [ -n "$FROM_TRUFFLEHOG" ]; then args+=( --from-trufflehog "$FROM_TRUFFLEHOG" ); fi
        if [ -n "$FROM_BETTERLEAKS" ]; then args+=( --from-betterleaks "$FROM_BETTERLEAKS" ); fi
        if [ -n "$EXTRA_ARGS" ]; then
          read -ra extra <<< "$EXTRA_ARGS"
          args+=( "${extra[@]}" )
        fi
        args+=( "$TARGET" )

        case "$FORMAT" in
          json)  DEST="${OUTPUT_FILE:-credactor-results.json}"  ;;
          sarif) DEST="${OUTPUT_FILE:-credactor-results.sarif}" ;;
          *)
            # Text belongs in the job log, where somebody will actually read it.
            # Redirecting it to a file empties the log and helps nobody.
            if [ -n "$OUTPUT_FILE" ]; then
              echo "::warning::output-file is ignored for text format; the report stays in the job log. Use format json or sarif to write a file."
            fi
            DEST=""
            ;;
        esac

        PYBIN="$(command -v python || command -v python3 || true)"

        # The scan writes to a fresh file in $RUNNER_TEMP. The report is copied
        # to DEST afterwards, and only if DEST is not a symlink, is a regular
        # file or absent, and resolves inside the workspace or the runner temp
        # directory (a directory symlink on the way must resolve there too).
        # A destination that fails the check fails the step (SR-03).
        dest_is_safe() {
          if [ -L "$DEST" ] || { [ -e "$DEST" ] && [ ! -f "$DEST" ]; }; then
            echo "::error::output-file '$DEST' is a symlink or not a regular file; refusing to write the report there."
            return 1
          fi
          if ! "$PYBIN" -I -c '
        import os, sys
        dest = os.path.normcase(os.path.realpath(sys.argv[1]))
        roots = [os.path.normcase(os.path.realpath(r)) for r in sys.argv[2:] if r]
        sys.exit(0 if any(dest.startswith(r.rstrip(os.sep) + os.sep) for r in roots) else 1)
        ' "$DEST" "${GITHUB_WORKSPACE:-}" "${RUNNER_TEMP:-}"; then
            echo "::error::output-file '$DEST' resolves outside the workspace and the runner temp directory; refusing to write the report there."
            return 1
          fi
        }

        OUT=""
        if [ -n "$DEST" ]; then
          if [ -z "$PYBIN" ]; then
            echo "::error::No python found to validate output-file '$DEST'."
            exit 2
          fi
          dest_is_safe || exit 2
          # A redirect into a directory that does not exist fails before
          # Credactor ever runs, and leaves $? at 1, which is indistinguishable
          # from "credentials found". Create the directory up front and fail
          # loudly if that is not possible, rather than reporting a phantom
          # finding. The containment check above has already run, so this
          # cannot create a directory outside the workspace.
          outdir="$(dirname -- "$DEST")"
          if ! mkdir -p -- "$outdir" 2>/dev/null; then
            echo "::error::Cannot create directory '$outdir' for output-file '$DEST'."
            exit 2
          fi
          if ! OUT="$(mktemp "${RUNNER_TEMP:-${TMPDIR:-/tmp}}/credactor-report.XXXXXX")"; then
            echo "::error::Cannot create a temporary report file."
            exit 2
          fi
        fi

        echo "Running: credactor ${args[*]}"

        # The runner starts this shell with "bash -eo pipefail", so a bare
        # "credactor ...; code=$?" would stop the step on exit 1 (findings)
        # before any output is written, and the gate below would never run.
        # "|| code=$?" keeps the exit code without tripping -e.
        code=0
        if [ -n "$OUT" ]; then
          credactor "${args[@]}" > "$OUT" || code=$?
        else
          credactor "${args[@]}" || code=$?
        fi

        if [ -n "$DEST" ]; then
          # Check again right before the copy. cat into DEST (not cp from the
          # 0600 temp file) keeps the report's usual file mode.
          dest_is_safe || exit 2
          if ! cat "$OUT" > "$DEST"; then
            echo "::error::Cannot write output-file '$DEST'."
            exit 2
          fi
          rm -f "$OUT"
        fi

        # --- Findings count and report path, for downstream steps.
        count=""
        if [ -n "$DEST" ] && [ -s "$DEST" ]; then
          # The physical path of the file written, as a native path on every
          # OS (Git Bash's pwd gives /d/a/... on Windows, which native tools
          # such as the SARIF upload cannot open).
          abs="$("$PYBIN" -I -c 'import os,sys;print(os.path.realpath(sys.argv[1]))' "$DEST")"
          reject_line_breaks output-file "$abs"
          echo "report-file=$abs" >> "$GITHUB_OUTPUT"
          # -I so no module in the working directory can be imported (SR-02).
          count="$("$PYBIN" -I -c 'import json,sys;d=json.load(open(sys.argv[1],encoding="utf-8"));print(sum(len(r.get("results",[])) for r in d.get("runs",[])) if sys.argv[2]=="sarif" else d.get("count",0))' "$DEST" "$FORMAT" 2>/dev/null)" || count=""
        fi
        echo "findings-count=$count" >> "$GITHUB_OUTPUT"
        # Exit 1 means findings only when there is a report of them. An uncaught
        # error in the CLI also exits 1; with json/sarif there is then no valid
        # report, so treat it as the error it is rather than as findings.
        if [ "$code" = "1" ] && [ -n "$DEST" ] && [ -z "$count" ]; then
          echo "::error::Credactor exited 1 without writing a valid $FORMAT report; treating this as an error, not a findings result."
          code=2
        fi
        # Written last (SR-04); the gate step reads this value.
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"

        # --- Job summary.
        {
          echo "### Credactor"
          echo ""
          echo "| | |"
          echo "|---|---|"
          echo "| Target | \`$TARGET\` |"
          echo "| Exit code | \`$code\` |"
          if [ -n "$count" ]; then echo "| Findings | \`$count\` |"; fi
          if [ -n "$INGEST" ]; then echo "| Ingestion | enabled |"; fi
          echo ""
          case "$code" in
            0) echo "No unresolved findings." ;;
            1) echo "Credentials found. Review the report, then rotate anything real." ;;
            2) echo "Credactor exited with an error. This is a configuration or input fault, not a findings result." ;;
            *) echo "Unexpected exit code." ;;
          esac
        } >> "$GITHUB_STEP_SUMMARY"

        exit 0

    - name: Upload SARIF to Code Scanning
      if: inputs.upload-sarif == 'true' && inputs.format == 'sarif' && steps.scan.outputs.report-file != ''
      uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
      with:
        sarif_file: ${{ steps.scan.outputs.report-file }}

    - name: Apply gate
      shell: bash
      env:
        CODE: ${{ steps.scan.outputs.exit-code }}
        FAIL_ON_FINDINGS: ${{ inputs.fail-on-findings }}
        COUNT: ${{ steps.scan.outputs.findings-count }}
      run: |
        set -uo pipefail

        if [ "$CODE" = "0" ]; then
          echo "Credactor found no unresolved credentials."
          exit 0
        fi

        # Only 1 means findings. Anything else is an error and always fails:
        # a gate that silently passes on a broken config is worse than no gate,
        # and one that calls a crash "credentials found" sends the reader
        # hunting for a secret that was never there. 127 is the common case,
        # when the install step left no credactor on PATH.
        if [ "$CODE" != "1" ]; then
          echo "::error::Credactor exited $CODE. That is an error rather than a findings result, so the gate did not run to completion."
          exit 2
        fi

        if [ "$FAIL_ON_FINDINGS" = "true" ]; then
          echo "::error::Credactor found credentials${COUNT:+ ($COUNT finding(s))}. Rotate anything real; suppress false positives via .credactorignore."
          exit 1
        fi

        echo "::warning::Credactor found credentials${COUNT:+ ($COUNT finding(s))}, but fail-on-findings is false, so the step is not failing."
        exit 0
